<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 620 120"
  width="620"
  height="120"
  fill="none"
  role="img"
  aria-labelledby="flexpayz-logo-title flexpayz-logo-description"
>
  <title id="flexpayz-logo-title">FlexPayz</title>
  <desc id="flexpayz-logo-description">
    FlexPayz digital wearables logo with an FP monogram and champagne accent.
  </desc>

  <g id="flexpayz-mark" transform="translate(6 6)">
    <rect
      x="1"
      y="1"
      width="106"
      height="106"
      rx="32"
      stroke="var(--flexpayz-logo-champagne, #C5965D)"
      stroke-width="2"
    />
    <path
      d="M31 81V29H73"
      stroke="var(--flexpayz-logo-ink, #211F1C)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M31 54H62"
      stroke="var(--flexpayz-logo-ink, #211F1C)"
      stroke-width="8"
      stroke-linecap="round"
    />
    <path
      d="M67 29C82 29 92 39.5 92 53.5C92 67.5 82 78 67 78H54"
      stroke="var(--flexpayz-logo-champagne, #C5965D)"
      stroke-width="5"
      stroke-linecap="round"
    />
    <circle
      cx="91.5"
      cy="82.5"
      r="4.5"
      fill="var(--flexpayz-logo-champagne, #C5965D)"
    />
  </g>

  <g id="flexpayz-wordmark">
    <text
      x="142"
      y="61"
      fill="var(--flexpayz-logo-ink, #211F1C)"
      font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
      font-size="42"
      font-weight="600"
      letter-spacing="4.5"
    >
      FLEXPAYZ
    </text>
    <text
      x="145"
      y="88"
      fill="var(--flexpayz-logo-muted, #7A736B)"
      font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
      font-size="10"
      font-weight="600"
      letter-spacing="5.2"
    >
      DIGITAL WEARABLES
    </text>
    <path
      d="M145 101H568"
      stroke="var(--flexpayz-logo-champagne, #C5965D)"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </g>
</svg>
